# Generador de trafico hacia el microservicio (simula usuarios) para
# evidenciar el aumento de CPU/memoria y la generacion de logs 200 y 404.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: dev
  labels:
    app: load-generator
spec:
  replicas: 4
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                wget -q -T 2 -O /dev/null http://podinfo.dev.svc.cluster.local/ || true
                wget -q -T 2 -O /dev/null http://podinfo.dev.svc.cluster.local/api/info || true
                wget -q -T 2 -O /dev/null http://podinfo.dev.svc.cluster.local/status/404 || true
                sleep 0.01
              done
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 32Mi
