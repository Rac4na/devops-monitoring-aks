# Valores de Helm para Grafana (chart grafana/grafana)
# Uso: helm upgrade --install grafana grafana/grafana -n monitoring -f helm/grafana-values.yaml
service:
  type: LoadBalancer

# Data sources aprovisionados automaticamente (Prometheus + Loki)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local:80
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100

# Dashboards aprovisionados desde el ConfigMap "grafana-dashboards"
# (creado con: kubectl create configmap grafana-dashboards -n monitoring --from-file=dashboards/)
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
dashboardsConfigMaps:
  default: grafana-dashboards
